<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#07111f" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Capta Academy" />
  <meta name="format-detection" content="telephone=no" />
  <meta name="description" content="Capta Academy — universidade interna de treinamento para Captadores, Liners e Closers." />
  <title>Capta Academy</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="pwa-icon-192.png" type="image/png" />
  <link rel="apple-touch-icon" href="pwa-icon-192.png" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <a class="brand" href="#home" aria-label="Capta Academy">
        <span class="brand-mark">C</span>
        <span><strong>CAPTA</strong><small>ACADEMY</small></span>
      </a>
      <div class="top-actions">
        <span id="cloudBadge" class="cloud-badge" hidden>● Nuvem</span>
        <button id="managerBtn" class="ghost-btn" hidden>Gestor</button>
        <button id="installBtn" class="ghost-btn" hidden>Instalar</button>
        <button id="profileBtn" class="avatar-btn" aria-label="Perfil">CA</button>
      </div>
    </header>

    <main id="app" class="content" aria-live="polite"></main>

    <nav class="bottom-nav" aria-label="Navegação principal">
      <a href="#home" data-nav="home"><span>⌂</span><small>Início</small></a>
      <a href="#trilhas" data-nav="trilhas"><span>▤</span><small>Trilhas</small></a>
      <a href="#simulador" data-nav="simulador"><span>⚡</span><small>Simular</small></a>
      <a href="#ranking" data-nav="ranking"><span>🏆</span><small>Ranking</small></a>
      <a href="#perfil" data-nav="perfil"><span>●</span><small>Perfil</small></a>
    </nav>
  </div>

  <dialog id="quizDialog" class="dialog-card quiz-dialog">
    <div id="quizContent"></div>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.min.js"></script>
  <script src="supabase-config.js"></script>
  <script src="app.js" defer></script>
  <script src="pwa.js" defer></script>
</body>
</html>
